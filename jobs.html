<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Technician Work Orders</title>
  <link rel="stylesheet" href="/technician/assets/technician.css">
</head>

<body>

  <!-- ASSIGNED JOBS -->
  <div class="glass">
    <h1 class="accent">Your Assigned Work Orders</h1>
    <div class="gold-line"></div>

    <div id="assignedJobs">Loading...</div>
  </div>

  <!-- AVAILABLE JOBS -->
  <div class="glass">
    <h1 class="accent">Available Work Orders</h1>
    <div class="gold-line"></div>

    <div id="unassignedJobs">Loading...</div>
  </div>

  <!-- SUPABASE (same as admin dashboard) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- TECHNICIAN LOGIC -->
  <script src="technician.js"></script>

  <!-- PAGE-SPECIFIC LOGIC -->
  <script>
    async function loadJobs() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const techId = session.user.id;

      // Fetch assigned jobs
      const { data: assigned } = await supabase
        .from("jobs")
        .select("*")
        .eq("assigned_to", techId);

      // Fetch unassigned jobs
      const { data: unassigned } = await supabase
        .from("jobs")
        .select("*")
        .is("assigned_to", null);

      renderJobs("assignedJobs", assigned, true);
      renderJobs("unassignedJobs", unassigned, false);
    }

    function renderJobs(containerId, jobs, isAssigned) {
      const container = document.getElementById(containerId);

      if (!jobs || jobs.length === 0) {
        container.innerHTML = "<p>No work orders found.</p>";
        return;
      }

      container.innerHTML = "";

      jobs.forEach(job => {
        const div = document.createElement("div");
        div.className = "glass";
        div.style.marginBottom = "12px";

        div.innerHTML = `
          <h3 class="accent">${job.title}</h3>
          <p><b>Address:</b> ${job.address}</p>
          <p><b>Status:</b> ${job.status}</p>
          <p><b>Scheduled:</b> ${job.scheduled_date || "Not Scheduled"}</p>

          <button onclick="openJob('${job.id}')">
            ${isAssigned ? "Open Work Order" : "View Details"}
          </button>
        `;

        container.appendChild(div);
      });
    }

    function openJob(jobId) {
      window.location.href = "job-details.html?id=" + jobId;
    }

    loadJobs();
  </script>

</body>
</html>
