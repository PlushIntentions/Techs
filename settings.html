<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Technician Settings</title>
  <link rel="stylesheet" href="technician.css">
</head>

<body>

  <!-- PROFILE PANEL -->
  <div class="glass">
    <h1 class="accent">Your Profile</h1>
    <div class="gold-line"></div>

    <p><b>Name:</b> <span id="techName">Loading...</span></p>
    <p><b>Email:</b> <span id="techEmail">Loading...</span></p>

    <div style="margin-top: 20px;">
      <label><b>Phone Number:</b></label>
      <input id="phoneInput" type="text" style="
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: #fff;
      ">
    </div>
