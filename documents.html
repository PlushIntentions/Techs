    <div id="documentsContainer">Loading...</div>

  <script>

      { key: "id_url", label: "Driver’s License / State ID" },
      { key: "certs_url", label: "Certifications" },
      { key: "insurance_url", label: "Insurance (Optional)" }
    ];

    let techId = null;
    let profile = null;

    async function loadDocuments() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      techId = session.user.id;

      // Load technician profile
      const { data } = await supabase
        .from("technicians")
        .select("*")
        .eq("id", techId)
        .single();

      profile = data;

      renderDocumentCards();
    }
